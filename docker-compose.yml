version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: odin_zapros_app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=odin_canary
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/odin_canary
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: odin_zapros_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: odin_canary
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d odin_canary"]
      interval: 4s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
